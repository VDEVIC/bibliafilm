<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Biblia Film · Película completa de la Biblia</title>
<meta name="description" content="La película completa de la Biblia, palabra por palabra. Cada día se suma contenido según llega el apoyo.">
<meta property="og:title" content="Biblia Film · Película completa de la Biblia">
<meta property="og:description" content="Cada día iremos sumando contenido según vayamos recibiendo apoyo para terminar el proyecto.">
<meta property="og:image" content="https://bibliafilm.com/media/portada.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231d1d1f'/><text x='32' y='45' font-size='36' text-anchor='middle' font-family='Georgia' fill='%23ffffff'>B</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css?v=1788568051">
</head>
<body>
<main>
  <section class="hero">
    <header class="cabecera">
      <select class="idioma" id="idioma" aria-label="Idioma">
        <option value="es">Español</option><option value="en">English</option><option value="pt">Português</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="zh">中文</option><option value="ru">Русский</option>
      </select>
      <div class="marca">Biblia Film</div>
      <h1 id="t-titulo">Película completa <span>de la Biblia.</span></h1>
      <p class="intro" id="t-intro">Cada día iremos sumando contenido según vayamos recibiendo apoyo para terminar el proyecto.</p>

    </header>
    <div class="peli">
      <div class="marco">
        <video id="pelicula" playsinline preload="metadata" controls></video>
        <button class="play" id="play" aria-label="Ver"></button>
      </div>
      <div class="progreso">
        <div class="pro-cab"><span id="t-progreso">Progreso del proyecto</span><strong id="pro-pct">0 %</strong></div>
        <div class="barra"><div class="lleno" id="pro-lleno"></div></div>
        <div class="pro-pie" id="pro-pie"></div>
      </div>
    </div>

    <div class="texto">
      <div class="apoyo" id="apoyo">
        <button class="boton" id="apoyar" type="button">Apoyar el proyecto</button>
        <div class="desplegable" id="zEligir"><div><p class="elige" id="t-elige">Elige el método de pago</p></div></div>
        <div class="desplegable marcasCaja" id="zMarcas"><div><div class="marcas" id="marcas" role="radiogroup" aria-label="Forma de pago">
          <button type="button" data-m="apple" aria-label="Apple Pay"><img src="img/apple-pay.svg" alt=""></button>
          <button type="button" data-m="google" aria-label="Google Pay"><img src="img/google-pay.svg" alt=""></button>
          <button type="button" data-m="tarjeta" aria-label="Tarjeta"><img src="img/visa.svg" alt=""><img src="img/mastercard.svg" alt=""></button>
        </div></div></div>
        <div class="desplegable" id="zImportes"><div class="detalle-int">
          <div class="importes" id="importes">
            <button type="button" data-v="3">3 €</button>
            <button type="button" data-v="5" class="on">5 €</button>
            <button type="button" data-v="10">10 €</button>
            <button type="button" data-v="20">20 €</button>
            <label class="otro"><span>€</span><input id="otro" type="number" min="0.5" max="1000" step="0.5" placeholder="otro" inputmode="decimal"></label>
          </div>
          <label class="acepto"><input type="checkbox" id="acepto"><span id="t-acepto">He leído y acepto las <a href="/condiciones" target="_blank" rel="noopener">condiciones del apoyo</a>.</span></label>
        </div></div>
        <div class="desplegable" id="zApple"><div class="detalle-int"><div id="expressApple"></div></div></div>
        <div class="desplegable" id="zGoogle"><div class="detalle-int"><div id="expressGoogle"></div></div></div>
        <div class="desplegable" id="zTarjeta"><div class="detalle-int"><div id="tarjeta"></div><button class="boton" id="pagar" type="button">Apoyar con 5 €</button></div></div>
        <p class="aviso" id="aviso" hidden></p>
      </div>
    </div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js"></script>
<script src="https://js.stripe.com/v3/"></script>
<script src="app.js?v=1788568051"></script>
<script src="apoyo.js?v=1788568051"></script>
</body>
</html>
